# Serves the static export the way vercel.json + middleware.ts do on Vercel:
# clean URLs, the 404 page, markdown docs as text/markdown, and the one Vercel
# function (api/v0.ts) borrowed from production.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # TLS ends at the host's proxy, so keep nginx's own redirects relative.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml text/markdown application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # trailingSlash: false — /docs/nextjs/button/ -> /docs/nextjs/button
    rewrite ^/(.+)/$ /$1 permanent;

    # cleanUrls — /docs/nextjs/button serves button.html (and button.txt for
    # client-side navigation, which is requested by its full name).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.md$ {
        types { }
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # "Open in v0" calls this on the page's own origin. It is a Vercel function
    # (vercel.json rewrite -> api/v0.ts) that a static host cannot run.
    location /r/v0-themed/ {
        return 302 https://algorize-ui.vercel.app$request_uri;
    }
}
