# Serves the static export the way vercel.json / serve.json / middleware.ts do
# elsewhere: clean URLs, the 404 page, markdown docs as text/markdown, long
# cache for hashed assets, and the one Vercel function (api/v0.ts) borrowed
# from production.
#
# This file is included inside nginx's `http {}` block, so `map` is allowed here.
#
# Response headers are all set once, at server level, from the maps below.
# Do NOT add `add_header` inside a `location`: nginx then drops every server-level
# add_header for that location, and the security headers would silently vanish
# from it. Put new per-path values in the maps instead.

# Registry and generated assets: reachable, but kept out of search indexes
# (serve.json does the same with X-Robots-Tag). An empty value sends no header.
map $uri $robots_tag {
    default "";
    ~^/(r|docs-md|fonts)/ "noindex";
}

# Same rules as serve.json: hashed build output is immutable, markdown is cached
# for an hour, the service worker must always revalidate.
map $uri $cache_control {
    default "";
    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~\.md$ "public, max-age=3600";
    /sw.js "no-cache";
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version in the Server header or error pages.
    server_tokens off;

    # TLS ends at the host's proxy, so keep nginx's own redirects relative.
    absolute_redirect off;

    # Security headers. `always` so they are also sent on 404 and redirects.
    # Not set here on purpose:
    #   Strict-Transport-Security: the proxy terminates TLS, so it belongs there.
    #   Content-Security-Policy: the site relies on inline scripts (theme init,
    #     analytics), so a CSP needs a nonce/hash plan first.
    #   Permissions-Policy: the docs run camera/microphone demos (QR reader,
    #     voice note), which a blanket policy would break.
    # X-Frame-Options SAMEORIGIN: the docs embed their own /preview pages in
    # iframes, which stay allowed. Other sites cannot frame this one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control $cache_control always;

    charset utf-8;
    charset_types text/css text/plain text/xml text/markdown application/javascript application/json;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    # trailingSlash: false: /docs/nextjs/button/ -> /docs/nextjs/button
    rewrite ^/(.+)/$ /$1 permanent;

    # Dotfiles are never part of the export. /.well-known/ stays reachable.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # cleanUrls: /docs/nextjs/button serves button.html (and button.txt for
    # client-side navigation, which is requested by its full name).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # /llm is a route handler, so the export writes it as a file with no
    # extension, which nginx would send as application/octet-stream (a download).
    # vercel.json and serve.json set text/markdown for it.
    location = /llm {
        default_type text/markdown;
        try_files $uri =404;
    }

    location /_next/static/ {
        try_files $uri =404;
    }

    location ~* \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # /skills/<skill>/<file>.mdc (Cursor rules) is not in nginx's mime types and
    # would download. The route handler serves it as text/plain.
    location ~* \.mdc$ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location /r/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /docs-md/ {
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    # "Open in v0" calls this on the page's own origin. It is a Vercel function
    # (vercel.json rewrite -> api/v0.ts) that a static host cannot run. The more
    # specific prefix wins over /r/ above.
    location /r/v0-themed/ {
        return 302 https://avaraui.vercel.app$request_uri;
    }
}