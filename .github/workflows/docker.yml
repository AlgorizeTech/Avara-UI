name: Docker Security Scan

# Trivy security scan only: no image build, no push, no registry login.
# Easypanel builds and deploys from the Dockerfile on its own.
# Runs only when something that decides what ships changes (the Dockerfile and the
# npm dependencies), so ordinary component/page PRs do not use Actions minutes.
# Because of that filter, do NOT make this check "required" in branch protection.
# Independent of registry.yml. Docs: docs/DOCKER-CICD.md

on:
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/docker.yml

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: docker-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HIGH and CRITICAL findings that have a fix fail the job. Accepted risks go
      # in a .trivyignore file at the repo root.

      # The app's npm dependencies (build-time only: the shipped image has no
      # node_modules, but they decide what ends up in the static files).
      - name: Scan dependencies (package-lock.json)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # The shipped image is the last FROM in the Dockerfile plus static files, so
      # its OS packages come entirely from that base image. Scanning it directly
      # avoids a full build, and reading it from the Dockerfile keeps the two in sync.
      # `!cancelled()` so this still runs, and reports, when the lockfile scan above
      # failed. The job still ends red if either scan fails.
      - name: Find the shipped base image
        id: base
        if: ${{ !cancelled() }}
        run: |
          ref=$(awk '/^FROM / {img=$2} END {print img}' Dockerfile)
          echo "Shipped base image: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Scan shipped base image (OS packages)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.base.outputs.ref }}
          vuln-type: os,library
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
